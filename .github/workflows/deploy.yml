name: Deploy LAKSHYA to GitHub Pages

on:
  push:
    branches: ['main', 'master']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --legacy-peer-deps --no-audit --no-fund
          fi

      - name: Build Vite bundle
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build

      - name: Add SPA 404 fallback and disable Jekyll
        run: |
          touch dist/.nojekyll
          cp dist/index.html dist/404.html

      - name: Upload dist artifact to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Ensure built bundle deploys after any legacy branch deploy
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          curl -fsSL -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/pages" \
            -d '{"build_type":"workflow"}' >/dev/null 2>&1 || true

          waited=0
          for i in $(seq 1 24); do
            ACTIVE=$(curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/runs?head_sha=$SHA&per_page=20" \
              | node -e '
                const data = JSON.parse(require("fs").readFileSync(0, "utf8"));
                const busy = (data.workflow_runs || []).some(
                  (r) => r.name === "pages build and deployment" && r.status !== "completed"
                );
                process.stdout.write(busy ? "1" : "0");
              ' 2>/dev/null || echo "0")
            if [ "$ACTIVE" = "0" ]; then
              break
            fi
            waited=1
            echo "Waiting for legacy pages build and deployment to finish ($i/24)..."
            sleep 5
          done
          if [ "$waited" = "1" ]; then
            sleep 3
          fi

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
